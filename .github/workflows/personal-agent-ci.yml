name: Personal AI Agent CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-contracts:
    name: Architecture contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip python-dotenv
      - name: Compile changed architecture modules
        run: >-
          python -m py_compile
          jarvis_agent/windows_app_discovery.py
          jarvis_agent/ui_grounding.py
          jarvis_agent/research_broker.py
          jarvis_agent/tools.py
          jarvis_agent/native_tools.py
          jarvis_agent/windows_perception.py
          jarvis_agent/agent_runtime.py
      - name: Run new architecture tests
        run: >-
          python -m unittest
          tests.test_windows_app_discovery
          tests.test_ui_grounding
          tests.test_research_broker
          -v
      - name: Run launch compatibility regressions
        run: python -m unittest tests.test_native_tools -v
